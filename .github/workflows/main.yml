name: Build Spio APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Repair Android Project
        run: |
          cd android
          # حذف ملفات الإعدادات التي قد تسبب تعارضاً
          rm -rf .gradle
          # إنشاء ملف المتغيرات لـ Cordova لضمان عدم توقف البناء
          mkdir -p capacitor-cordova-android-plugins
          echo "ext { }" > capacitor-cordova-android-plugins/cordova.variables.gradle
          # إعطاء صلاحية التنفيذ لملف gradlew
          chmod +x gradlew

      - name: Build APK with Force Options
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spio-APK-File
          path: android/app/build/outputs/apk/debug/*.apk
