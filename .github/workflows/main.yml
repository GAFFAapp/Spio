name: Build Spio APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Deep Clean and Repair Project
        run: |
          cd android
          # حذف كل المجلدات المؤقتة والملفات التي قد تسبب تعارض
          rm -rf .gradle build app/build
          # إنشاء ملف Cordova المفقود الذي اشتكى منه النظام سابقاً
          mkdir -p capacitor-cordova-android-plugins
          echo "ext { }" > capacitor-cordova-android-plugins/cordova.variables.gradle
          # التأكد من أن ملف الإعدادات الأساسي موجود
          if [ ! -f "settings.gradle" ]; then
            echo "include ':app'" > settings.gradle
          fi
          chmod +x gradlew

      - name: Force Build APK
        run: |
          cd android
          # استخدام خيار --no-build-cache لضمان بناء جديد كلياً
          ./gradlew assembleDebug --no-daemon --no-build-cache -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spio-APK-File
          path: android/app/build/outputs/apk/debug/*.apk
