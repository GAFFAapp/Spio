name: Build Spio APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

            - name: Build with Gradle
        run: |
          cd android
          # تحديث ملفات التشغيل لتجنب تعارض النسخ
          ./gradlew wrapper --gradle-version 8.5
          chmod +x gradlew
          # البناء مع تجاهل التحذيرات غير الضرورية
          ./gradlew assembleDebug --no-daemon
          

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spio-APK-File
          path: "android/app/build/outputs/apk/debug/*.apk"
          
